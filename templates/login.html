<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FADEDSHOP - Panel Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container" style="max-width: 400px;">
        <header>
            <h1>FADEDSHOP</h1>
            <p>Acceso Administrador</p>
        </header>
        
        <main class="card">
            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" name="usuario" required placeholder="Usuario">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required placeholder="Contraseña">
                </div>
                
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <p style="color: var(--color-rojo); font-size: 0.85rem; margin-bottom: 15px; text-align: center; font-weight: bold;">{{ message }}</p>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <button type="submit">Ingresar</button>
            </form>
        </main>
    </div>
</body>
</html>
